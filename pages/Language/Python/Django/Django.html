<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Wiki</title>
  <link type="text/css" rel="stylesheet" href="../../../../css/index.css" />
</head>

<body>
  <section>
    <div class="iframe-content">

      <div class="card">
        <h2>Online Documentation</h2>
        <p>Comprehensive documentation for learning Python Django.</p>
      </div>

      <div class="card">
        <h2>Startup Commands (Django)</h2>

        <div class="code-inline">
          <code>python -m venv venv</code>
          <button class="copy-btn" onclick="copyFromCode(this)">Copy</button>
        </div>

        <div class="code-inline">
          <code>source venv/bin/activate</code>
          <button class="copy-btn" onclick="copyFromCode(this)">Copy</button>
        </div>

        <div class="code-inline">
          <code>pip install django</code>
          <button class="copy-btn" onclick="copyFromCode(this)">Copy</button>
        </div>

        <div class="code-inline">
          <code>django-admin startproject myproject</code>
          <button class="copy-btn" onclick="copyFromCode(this)">Copy</button>
        </div>

        <div class="code-inline">
          <code>cd myproject</code>
          <button class="copy-btn" onclick="copyFromCode(this)">Copy</button>
        </div>

        <div class="code-inline">
          <code>python manage.py migrate</code>
          <button class="copy-btn" onclick="copyFromCode(this)">Copy</button>
        </div>

        <div class="code-inline">
          <code>python manage.py runserver</code>
          <button class="copy-btn" onclick="copyFromCode(this)">Copy</button>
        </div>

        <div class="code-inline">
          <code>http://127.0.0.1:8000/</code>
          <button class="copy-btn" onclick="copyFromCode(this)">Copy</button>
        </div>

      </div>

    </div>
  </section>
  <script>
    // Function to copy text to clipboard
    function copyFromPre(button) {
      const pre = button.parentElement.querySelector("pre");
      const text = pre.innerText;
      navigator.clipboard.writeText(text);
    }

    // Alternative function to copy from inline code blocks    
    function copyFromCode(button) {
      const code = button.parentElement.querySelector("code");
      const text = code.innerText;
      navigator.clipboard.writeText(text);
    }
  </script>
</body>

</html>
